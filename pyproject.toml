[project]
name = "book-log"
version = "0.1.0"
description = "Physical reading log companion: books.yaml database, catalog PDF, and printable cover cutouts"
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.2",
    "weasyprint==65.1",
    "reportlab==4.4.1",
    "pillow==11.2.1",
    "requests==2.32.5",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
